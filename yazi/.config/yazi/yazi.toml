[mgr]
show_hidden = false
show_symlink = false
sort_by = "mtime"

[opener]
play = [
    { run = 'mpv %s', orphan = true, for = "unix" }
]
view = [
    { run = 'imv %s', orphan = true, for = "unix" }
]

[open]
rules = [
    { mime = "image/*", use = "view" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
]
